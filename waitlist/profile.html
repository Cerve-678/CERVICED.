<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CERVICED</title>
<meta name="description" content="Book beauty and wellness professionals on CERVICED.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bakbak+One&family=Jura:wght@500;600;700&display=swap">
<style>
/* A provider's public link (cerviced.co/@handle), for an Instagram bio.
   Instagram opens links in its own browser, which won't hand off to the app,
   so this page has to make sense on its own. It reads only public fields of a
   live, active provider; vercel.json routes /@handle here. */
:root{
  --bg:#F5F1EC; --card:#FFFFFF; --text:#000000; --sub:#7E6667;
  --border:rgba(126,102,103,0.14); --accent:#5C4033; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(92,64,51,0.05), 0 12px 32px -12px rgba(92,64,51,0.18);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1A1815; --card:#252220; --text:#F0ECE7; --sub:#9C8A8B;
    --border:rgba(126,102,103,0.18); --accent:#AF9197; --on-accent:#1A1815;
    --shadow:0 12px 32px -12px rgba(0,0,0,0.5);
  }
}
*{ box-sizing:border-box }
html,body{ margin:0; background:var(--bg); color:var(--text) }
body{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center;
  font-family:'Jura','Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding:0 16px env(safe-area-inset-bottom);
}
.wordmark{
  font-family:'Bakbak One',sans-serif; font-size:18px; letter-spacing:2px;
  color:var(--text); text-decoration:none; margin:28px 0 22px;
}
.card{
  width:100%; max-width:420px; background:var(--card); border:1px solid var(--border);
  border-radius:28px; box-shadow:var(--shadow); overflow:hidden; text-align:center;
}
.hero{ height:120px; background:linear-gradient(160deg, var(--hero-from, #EDE8E2), var(--hero-to, #C4A8AE)) }
.logo{
  width:112px; height:112px; border-radius:50%; margin:-62px auto 0; display:block;
  object-fit:cover; background:var(--card); border:4px solid var(--card);
}
.logo-fallback{
  display:flex; align-items:center; justify-content:center;
  font-family:'Bakbak One',sans-serif; font-size:40px; color:var(--brand, var(--accent));
}
.body{ padding:14px 24px 26px }
h1{ font-family:'Bakbak One',sans-serif; font-weight:400; font-size:26px; line-height:1.15; margin:8px 0 6px; overflow-wrap:anywhere }
.meta{ color:var(--sub); font-size:15px; font-weight:600; margin:0 }
.btn{
  display:flex; align-items:center; justify-content:center; width:100%; min-height:52px;
  border-radius:16px; text-decoration:none; font-family:'Bakbak One',sans-serif;
  font-size:15px; letter-spacing:0.5px; margin-top:12px;
}
.btn-primary{ background:var(--brand, var(--accent)); color:var(--brand-ink, var(--on-accent)); margin-top:24px }
.btn-secondary{ border:1px solid var(--border); color:var(--text) }
.note{ color:var(--sub); font-size:13px; font-weight:600; line-height:1.45; margin:16px 0 0 }
.state{ padding:40px 24px; color:var(--sub); font-weight:600; font-size:15px; line-height:1.5 }
.state h1{ color:var(--text) }
[hidden]{ display:none !important }
</style>
</head>
<body>
<a class="wordmark" href="/">CERVICED</a>

<main class="card" id="card" aria-live="polite">
  <div class="state" id="loading">Loading…</div>

  <div class="state" id="missing" hidden>
    <h1>Profile not found</h1>
    <p>This profile isn't on CERVICED, or isn't live yet. Check the link and try again.</p>
    <a class="btn btn-secondary" href="/">Go to CERVICED</a>
  </div>

  <div id="profile" hidden>
    <div class="hero" id="hero"></div>
    <div id="logo-slot"></div>
    <div class="body">
      <h1 id="name"></h1>
      <p class="meta" id="meta"></p>
      <a class="btn btn-primary" id="open">Open in CERVICED</a>
      <a class="btn btn-secondary" href="/">Don't have the app? Join the waitlist</a>
      <p class="note">Already have CERVICED? Open this page in Safari or Chrome if the button doesn't open the app.</p>
    </div>
  </div>
</main>

<script>
(function () {
  // The publishable key, the same one bundled in the app. Row-level security
  // only lets it read providers that are live and active.
  var SUPABASE_URL = 'https://ztrfpfvvejzaysrelmfm.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0cmZwZnZ2ZWp6YXlzcmVsbWZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNDkwNzYsImV4cCI6MjA4OTkyNTA3Nn0.ZTBga3-C1dZ-WQIw2rniyqv29So7L9y6rxk2omn4SjI';
  var CATEGORY = {
    HAIR: 'Hair', NAILS: 'Nails', LASHES: 'Lashes', BROWS: 'Brows', MUA: 'Makeup',
    AESTHETICS: 'Aesthetics', MALE: 'Barbering & grooming', KIDS: 'Kids'
  };
  var HEX = /^#[0-9a-f]{6}$/i;

  function show(id) {
    ['loading', 'missing', 'profile'].forEach(function (key) {
      document.getElementById(key).hidden = key !== id;
    });
  }

  function isDark(hex) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) < 150;
  }

  var match = /^\/@([a-z0-9]+(?:-[a-z0-9]+)*)\/?$/i.exec(location.pathname);
  if (!match) { show('missing'); return; }
  var handle = match[1].toLowerCase();

  var query = SUPABASE_URL + '/rest/v1/providers'
    + '?slug=eq.' + encodeURIComponent(handle)
    + '&has_gone_live=eq.true&is_active=eq.true'
    + '&select=slug,display_name,logo_url,service_category,location_text,accent_color,gradient'
    + '&limit=1';

  fetch(query, { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
    .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(function (rows) {
      var p = rows && rows[0];
      if (!p) { show('missing'); return; }
      var name = (p.display_name || '').trim() || handle;
      document.title = name + ' on CERVICED';
      document.getElementById('name').textContent = name;

      var meta = [CATEGORY[p.service_category], (p.location_text || '').trim()].filter(Boolean);
      document.getElementById('meta').textContent = meta.join(' · ');

      var root = document.documentElement.style;
      if (Array.isArray(p.gradient) && HEX.test(p.gradient[0]) && HEX.test(p.gradient[p.gradient.length - 1])) {
        root.setProperty('--hero-from', p.gradient[0]);
        root.setProperty('--hero-to', p.gradient[p.gradient.length - 1]);
      }
      if (HEX.test(p.accent_color || '')) {
        root.setProperty('--brand', p.accent_color);
        root.setProperty('--brand-ink', isDark(p.accent_color) ? '#FFFFFF' : '#1B2740');
      }

      var slot = document.getElementById('logo-slot');
      if (/^https:\/\//.test(p.logo_url || '')) {
        var img = document.createElement('img');
        img.className = 'logo';
        img.alt = name + ' logo';
        img.src = p.logo_url;
        slot.appendChild(img);
      } else {
        var initial = document.createElement('div');
        initial.className = 'logo logo-fallback';
        initial.setAttribute('aria-hidden', 'true');
        initial.textContent = name.charAt(0).toUpperCase();
        slot.appendChild(initial);
      }

      document.getElementById('open').href = 'cerviced://provider/' + encodeURIComponent(p.slug);
      show('profile');
    })
    .catch(function () { show('missing'); });
})();
</script>
</body>
</html>
